<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>robotnik.exe — The Machine Curse</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="layout">
    <section class="hud-panel">
      <h1>robotnik.exe <span>The Machine Curse</span></h1>
      <p class="tag">Fanihenkinen, selaimessa toimiva toimintapeli</p>
      <div class="hud-grid">
        <div><strong>HP</strong> <span id="hp">100</span></div>
        <div><strong>Energia</strong> <span id="energy">100</span></div>
        <div><strong>Pisteet</strong> <span id="score">0</span></div>
        <div><strong>Wave</strong> <span id="wave">1</span></div>
      </div>
      <div class="controls">
        <p><kbd>WASD</kbd> liike · <kbd>Hiiri</kbd> tähtäys · <kbd>Vasen klikki</kbd> ammu</p>
        <p><kbd>Shift</kbd> dash · <kbd>E</kbd> EMP · <kbd>R</kbd> restart</p>
      </div>
      <p id="message" class="message">Tuhoa konekirotut droonit ja selviydy kolmesta wavesta.</p>
      <button id="startBtn">Käynnistä operaatio</button>
    </section>

    <section class="game-shell">
      <canvas id="game" width="960" height="540" aria-label="robotnik.exe game"></canvas>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
